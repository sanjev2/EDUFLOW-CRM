services:
  backend:
    environment:
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:?Set the browser-facing HTTPS frontend URL}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set the browser-facing HTTPS application URL}
      EMAIL_DELIVERY_MODE: smtp
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE:?Set SMTP_SECURE}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?Set EMAIL_FROM_ADDRESS}

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the browser-facing HTTPS API URL}
