name: eduflow

services:
  mongo:
    image: mongo:8.0.12-noble
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:?Set MONGODB_ROOT_USERNAME in the local .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?Set MONGODB_ROOT_PASSWORD in the local .env}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"quit(db.adminCommand('ping').ok ? 0 : 2)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      BACKEND_PORT: 5001
      FRONTEND_URL: http://localhost:3100
      PUBLIC_APP_URL: http://localhost:3100
      MONGODB_URI: mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@mongo:27017/eduflow_crm?authSource=admin
      UPLOAD_ROOT: /app/uploads
      EMAIL_DELIVERY_MODE: smtp
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in the local .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Set FIELD_ENCRYPTION_KEY in the local .env}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?Set PASSWORD_PEPPER in the local .env}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in the local .env}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT in the local .env}
      SMTP_SECURE: ${SMTP_SECURE:?Set SMTP_SECURE in the local .env}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in the local .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in the local .env}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-EduFlow}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?Set EMAIL_FROM_ADDRESS in the local .env}
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - private_uploads:/app/uploads
    networks:
      - web
      - data
    depends_on:
      mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5001/api/v1
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3100
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - web
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/frontend/.next/cache:size=64m,uid=100,mode=0700
    mem_limit: 384m
    cpus: 0.75
    stop_grace_period: 20s

networks:
  web:
  data:
    internal: true

volumes:
  mongodb_data:
  mongodb_config:
  private_uploads:
