name: Application quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:8.0.12-noble
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand(\"ping\").ok ? 0 : 2)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Frontend type-check
        run: npm run typecheck --workspace=@eduflow/frontend

      - name: Backend type-check
        run: npm run typecheck --workspace=@eduflow/backend

      - name: Frontend lint
        run: npm run lint --workspace=@eduflow/frontend

      - name: Backend lint
        run: npm run lint --workspace=@eduflow/backend

      - name: Complete automated tests
        run: npm run test --workspaces

      - name: Frontend production build
        run: npm run build --workspace=@eduflow/frontend

      - name: Backend production build
        run: npm run build --workspace=@eduflow/backend
